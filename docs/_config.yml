# GitHub Pages site (utf14-releases.ucaiug.io), built from docs/.
# Primer is the theme GitHub Pages uses when none is named; it is named here
# so that assets/css/style.scss can build on it.
theme: jekyll-theme-primer
title: UCA TF14 CIM Enterprise Package Releases
tagline: Published and interim CIM Enterprise package releases
description: >-
  Published and interim releases of the CIM Enterprise package from UCA TF14,
  with release notes and comparison reports.

# Primer prints the site title above a page whose title differs from it.
# index.md's first heading is the logo (HTML), which Pages does not read as a
# title, so give the page its title here.
defaults:
  # Link-preview (Open Graph / X card) image for every page, emitted by {% seo %}
  # in the layout. jekyll-seo-tag only reads a page-level image, so it is set
  # here as a front-matter default. The same PNG is the repo's Social preview.
  - scope:
      path: ""
    values:
      image:
        path: /media/logo/tf14-reports-social-1280x640.png
        width: 1280
        height: 640
        alt: "UCA TF14 CIM Releases"
  - scope:
      path: "index.md"
    values:
      title: UCA TF14 CIM Enterprise Package Releases

# Header buttons (index.md). Update with each new interim release or IEC edition.
# Bracketed values are placeholders still to be confirmed.
tf14_interim_release: "Enterprise14v04"
tf14_interim_url: "[TF14 download link]"
tf14_interim_notes: "[/<folder>/<release>_ReleaseNotes.pdf]"
tf14_is_edition: "Ed 2.0"
tf14_is_release: "[Ed 2.0 UML release]"
tf14_is_url: "[public IEC UML link]"
